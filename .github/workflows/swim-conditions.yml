name: Swim Conditions Check

on:
  schedule:
    # 07:00 Europe/Paris (summer, UTC+2) = 05:00 UTC
    # Adjust if you want a different check time or a second run in the afternoon
    - cron: '0 5 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run swim conditions check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORLDTIDES_KEY: ${{ secrets.WORLDTIDES_KEY }}
        run: python swim_conditions.py
