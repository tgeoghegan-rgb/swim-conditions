name: Swim Conditions Check

on:
  schedule:
    # 07:30 and 15:30 Europe/Paris (summer, UTC+2) = 05:30 and 13:30 UTC
    # After daylight saving ends in autumn, shift both by 1 hour later in UTC
    # to keep hitting 07:30/15:30 local (i.e. 06:30 and 14:30 UTC)
    - cron: '30 5 * * *'
    - cron: '30 13 * * *'
  workflow_dispatch: {}   # lets you trigger it manually from the Actions tab to test

jobs:
  check-conditions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install requests

      - name: Run swim conditions check
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORLDTIDES_KEY: ${{ secrets.WORLDTIDES_KEY }}
        run: python swim_conditions.py
